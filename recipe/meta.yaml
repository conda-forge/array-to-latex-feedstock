{% set name = "array-to-latex" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/josephcslater/array_to_latex/archive/v{{ version }}.tar.gz
  sha256: 52c53c86d02d042b1b915a725345a688bc93edd3d4420a486b9916c5a39fc0cf

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - pandas
    - clipboard

test:
  imports:
    - array_to_latex
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/josephcslater/array_to_latex/
  summary: Converts a NumPy/SciPy array or Pandas Numerical DataFrame to a LaTeX
  license: MIT
  license_file: license.rst.txt

extra:
  recipe-maintainers:
    - thewchan
