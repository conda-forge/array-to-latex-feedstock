schema_version: 1

context:
  name: array-to-latex
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/josephcslater/array_to_latex/archive/v${{ version }}.tar.gz
  sha256: 52c53c86d02d042b1b915a725345a688bc93edd3d4420a486b9916c5a39fc0cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas

tests:
  - python:
      imports:
        - array_to_latex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Converts a NumPy/SciPy array or Pandas Numerical DataFrame to a LaTeX
  license: MIT
  license_file: license.rst.txt
  homepage: https://github.com/josephcslater/array_to_latex/

extra:
  recipe-maintainers:
    - thewchan
